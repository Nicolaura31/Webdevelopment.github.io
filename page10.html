         <h2>Задание 6</h2>
         <script>
        function checkForm(event) {
            let form = document.forms["regForm"];
            
            
            if (form["userName"].value.trim() === "") {
                alert("Пожалуйста, заполните поле имени.");
                form["userName"].focus();
                event.preventDefault();
                return false;
            }
            
            
            if (form["userPass"].value.length <= 4) {
                alert("Пароль должен содержать больше 4-х символов.");
                form["userPass"].focus();
                event.preventDefault();
                return false;
            }
            
            
            if (form["userPass"].value !== form["userPassConfirm"].value) {
                alert("Пароли не совпадают.");
                form["userPassConfirm"].focus();
                event.preventDefault();
                return false;
            }
            
            
            let email = form["userEmail"].value;
            if (email === "" || email.indexOf("@") === -1) {
                alert("Поле электронного адреса не заполнено или не содержит символ '@'.");
                form["userEmail"].focus();
                event.preventDefault();
                return false;
            }
            
            
            
            if (form["userMessage"].value.length <= 10) {
                alert("Сообщение должно содержать больше 10 символов.");
                form["userMessage"].focus();
                event.preventDefault();
                return false;
            }
            
            alert("Все данные введены верно!");
            return true;
        }
    </script>
    
    <form name="regForm" onsubmit="checkForm(event)">
        <p>
            <label>Ваше имя*<br>
            <input type="text" name="userName"></label>
        </p>
        <p>
            <label>Пароль *<br>
            <input type="password" name="userPass"></label>
        </p>
        <p>
            <label>Подтверждение пароля*<br>
            <input type="password" name="userPassConfirm"></label>
        </p>
        <p>
            <label>Электронный адрес: *<br>
            <input type="text" name="userEmail"></label>
        </p>
        <p>
            <label>Тема сообщения:<br>
            <input type="text" name="userSubject"></label>
        </p>
        <p>
            <label>Сообщение:<br>
            <textarea name="userMessage" rows="5" cols="30"></textarea></label>
        </p>
        <p>
            <input type="submit" value="Отправить">
        </p>
        <p><small>* – необходимые для заполнения поля</small></p>
    </form>
</body>
