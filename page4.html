<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Анкета</title>

    <style>
        .page {
            display: flex;
            gap: 50px;
            align-items: flex-start;
        }

        .result {
            display: none;
            margin-top: 300px;
        }
    </style>
</head>
<body>

<div class="page">

    <form id="anketa">
        <h1>Анкета</h1>

        <br>Ваше имя:
        <br><input type="text" id="name"><br>

        <br>Ваш пол
        <br><input type="radio" name="sex" value="М"> М
        <br><input type="radio" name="sex" value="Ж"> Ж
        <br>

        <h2>На каком вы курсе учитесь?</h2>
        <select id="course">
            <option value="Первый">Первый</option>
            <option value="Второй">Второй</option>
            <option value="Третий">Третий</option>
            <option value="Четвертый">Четвертый</option>
        </select>
        <br>

        <h2>Какие языки программирования вы знаете?</h2>
        <br><input type="checkbox" name="language" value="C++"> C++
        <br><input type="checkbox" name="language" value="C#"> C#
        <br><input type="checkbox" name="language" value="1C"> 1C
        <br><input type="checkbox" name="language" value="HTML"> HTML
        <br><input type="checkbox" name="language" value="Python"> Python
        <br><input type="checkbox" name="language" value="GDScript"> GDScript
        <br><input type="checkbox" name="language" value="SQL script"> SQL script
        <br><input type="checkbox" name="language" value="PascalABC"> PascalABC
        <br>

        <h2>Напиши несколько слов о себе</h2>
        <textarea id="about"></textarea>

        <br><input type="button" value="Отправка данных" onclick="saveData()">
        <br><input type="button" value="Сброс значений поля" onclick="clearData()">
        <br><input type="button" value="Пишите мне" onclick="window.location.href='index.html';">
    </form>

    <div class="result" id="result">
        <p><b>Имя:</b> <span id="showName"></span></p>
        <p><b>Пол:</b> <span id="showSex"></span></p>
        <p><b>Курс:</b> <span id="showCourse"></span></p>
        <p><b>Языки:</b> <span id="showLanguages"></span></p>
        <p><b>О себе:</b> <span id="showAbout"></span></p>
    </div>

</div>

<script>
    function saveData() {
        let name = document.getElementById('name').value;

        let sex = '';
        let checkedSex = document.querySelector('input[name="sex"]:checked');
        if (checkedSex) {
            sex = checkedSex.value;
        }

        let course = document.getElementById('course').value;

        let languages = [];
        let checkedLanguages = document.querySelectorAll('input[name="language"]:checked');
        for (let i = 0; i < checkedLanguages.length; i++) {
            languages.push(checkedLanguages[i].value);
        }

        let about = document.getElementById('about').value;

        localStorage.setItem('name', name);
        localStorage.setItem('sex', sex);
        localStorage.setItem('course', course);
        localStorage.setItem('languages', languages.join(', '));
        localStorage.setItem('about', about);

        showData();
    }

    function showData() {
        document.getElementById('showName').textContent = localStorage.getItem('name') || '';
        document.getElementById('showSex').textContent = localStorage.getItem('sex') || '';
        document.getElementById('showCourse').textContent = localStorage.getItem('course') || '';
        document.getElementById('showLanguages').textContent = localStorage.getItem('languages') || '';
        document.getElementById('showAbout').textContent = localStorage.getItem('about') || '';
        document.getElementById('result').style.display = 'block';
    }

    function clearData() {
        document.getElementById('anketa').reset();

        localStorage.removeItem('name');
        localStorage.removeItem('sex');
        localStorage.removeItem('course');
        localStorage.removeItem('languages');
        localStorage.removeItem('about');

        document.getElementById('result').style.display = 'none';
    }
</script>

</body>
</html>
